name: Bump Version

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'CHANGELOG.md'
      - 'package.json'
      - '**/package.json'
  workflow_dispatch:
    inputs:
      increment:
        description: "Version bump type (patch, minor, major, or auto based on conventional commits)"
        required: true
        default: "auto"
        type: choice
        options:
          - auto
          - patch
          - minor
          - major
          - prepatch
          - preminor
          - premajor
          - prerelease

jobs:
  bump-version:
    name: Bump Version
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run release-it
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          INCREMENT="${{ github.event.inputs.increment }}"

          if [ "${{ github.event_name }}" = "push" ] && [ -z "$INCREMENT" ]; then
            LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
            if [ -n "$LAST_TAG" ]; then
              COMMITS=$(git log "${LAST_TAG}..HEAD" --oneline | grep -iE '(feat|fix|refactor|perf|revert)(\([^)]+\))?!?:|BREAKING CHANGE' || true)
            else
              COMMITS=$(git log --oneline | grep -iE '(feat|fix|refactor|perf|revert)(\([^)]+\))?!?:|BREAKING CHANGE' || true)
            fi

            if [ -z "$COMMITS" ]; then
              echo "No release-triggering commits (feat, fix, etc.) found since last tag. Skipping version bump."
              exit 0
            fi
          fi

          if [ -z "$INCREMENT" ] || [ "$INCREMENT" = "auto" ]; then
            npx release-it --ci
          else
            npx release-it "$INCREMENT" --ci
          fi
