services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2025-latest
    restart: unless-stopped
    ports:
      - "1433:1433"
    env_file:
      - ./database/.env
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_PID=Developer
    volumes:
      - mssql_data:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          '/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$${MSSQL_SA_PASSWORD}" -C -Q "SELECT 1" || exit 1',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "2.00"
          memory: 2G
    networks:
      - kon_network

  backend:
    image: ghcr.io/alfredojspera/kon-cloud/backend:${TAG:-latest}
    restart: unless-stopped
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      mssql:
        condition: service_healthy
      azurite:
        condition: service_started
    env_file:
      - ./backend/.env
    environment:
      - FORCE_COLOR=1
      - AZURE_STORAGE_CONNECTION_STRING=${AZURE_STORAGE_CONNECTION_STRING:-DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=YourAccountKey==;BlobEndpoint=http://azurite:10000/devstoreaccount1;}
      - AZURE_STORAGE_CONTAINER_NAME=${AZURE_STORAGE_CONTAINER_NAME:-expense-attachments}
    networks:
      - kon_network

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    restart: unless-stopped
    ports:
      - "10000:10000"
    command: "azurite-blob --blobHost 0.0.0.0"
    networks:
      - kon_network

  frontend:
    image: ghcr.io/alfredojspera/kon-cloud/frontend:${TAG:-latest}
    restart: unless-stopped
    build:
      context: .
      dockerfile: ./frontend/Dockerfile
      args:
        VITE_BACKEND_URL: ${VITE_BACKEND_URL:-http://localhost:3000}
    ports:
      - "5173:80"
    env_file:
      - ./frontend/.env
    depends_on:
      - backend
    networks:
      - kon_network

volumes:
  mssql_data:

networks:
  kon_network:
